<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Inventary - Crear Cliente</title>
    <link
      rel="icon"
      href="{{url_for('static', filename='img/Inventory.png')}}"
      type="image/png"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/clientes.css') }}"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  </head>
  <body>
    <header>
      <button class="btn-volver" onclick="window.history.back()">←</button>
      <div class="titulo">Crear Cliente</div>
    </header>

    <main>
      <div class="form-container">
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            <div class="flash-messages">
              {% for category, message in messages %}
                {% if category == 'errorCliente' %}
                  <div class="alert alert-danger">{{ message }}</div>
                {% endif %}
              {% endfor %}
            </div>
          {% endif %}
        {% endwith %}
        <form method="POST">
          <!-- Cedula -->
          <div class="form-group">
            <label for="cedula">Cédula:</label>
            <input
              type="number"
              id="cedula"
              name="cedula"
              class="form-control"
              required
              placeholder="Ej: 123456789"
              autocomplete="off"
            />
          </div>

          <!-- Nombre -->
          <div class="form-group">
            <label for="nombre">Nombre:</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              class="form-control"
              required
              placeholder="Ej: Juan"
              maxlength="100"
              autocomplete="off"
            />
          </div>

          <!-- Apellido -->
          <div class="form-group">
            <label for="apellido">Apellido:</label>
            <input
              type="text"
              id="apellido"
              name="apellido"
              class="form-control"
              required
              placeholder="Ej: Pérez"
              maxlength="100"
              autocomplete="off"
            />
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label for="telefono">Teléfono:</label>
            <input
              type="number"
              id="telefono"
              name="telefono"
              class="form-control"
              placeholder="Ej: 3114567890"
              autocomplete="off"
            />
          </div>

          <!-- Correo -->
          <div class="form-group">
            <label for="correo">Correo Electrónico:</label>
            <input
              type="email"
              id="correo"
              name="correo"
              class="form-control"
              required
              placeholder="Ej: usuario@correo.com"
              maxlength="100"
              autocomplete="off"
            />
          </div>

          <!-- Dirección -->
          <div class="form-group">
            <label for="direccion">Dirección:</label>
            <input
              type="text"
              id="direccion"
              name="direccion"
              class="form-control"
              required
              placeholder="Ej: Calle 123 #45-67"
              maxlength="150"
              autocomplete="off"
            />
          </div>

          <!-- Botones -->
          <div class="boton">
            <button type="submit" class="btn-guardar">Crear Cliente</button>
          </div>
          <div class="boton">
            <a href="javascript:history.back()" class="btn-cancelar">Cancelar</a>
          </div>
        </form>
      </div>
    </main>
  </body>
</html>
